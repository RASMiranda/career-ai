name: tests
on:
  push:
  pull_request:
  workflow_dispatch:     # the SDLC workflow starts it on agent branches (pushes by the workflow token start nothing)
jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
